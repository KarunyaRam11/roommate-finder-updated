<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: linear-gradient(135deg, #2193b0, #ff4e9b, #000000, #ff0000);
    color: white;
}

table {
    margin: auto;
    background: white;
    color: black;
    border-collapse: collapse;
}

th, td {
    border: 1px solid black;
    padding: 10px;
}

th {
    background: #ff4e9b;
    color: white;
}
</style>

</head>

<body>

<h2>🔐 Admin Panel</h2>

<table>
<tr>
<th>Name</th>
<th>Room</th>
<th>Gender</th>
<th>Block</th>
<th>Year</th>
<th>Contact</th>
</tr>

{% for person in data %}
<tr>
<td>{{ person.name }}</td>
<td>{{ person.room }}</td>
<td>{{ person.gender }}</td>
<td>{{ person.block }}</td>
<td>{{ person.year }}</td>
<td>{{ person.contact }}</td>
</tr>
{% endfor %}
</table>

</body>
</html>
