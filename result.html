<!DOCTYPE html>
<html>
<head>
<title>Result</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    text-align: center;
    background: linear-gradient(135deg, #2193b0, #ff4e9b, #000000, #ff0000);
    color: white;
    min-height: 100vh;
}

.box {
    background: white;
    color: black;
    margin: 40px auto;
    padding: 20px;
    width: 320px;
    border-radius: 12px;
}
</style>

</head>

<body>

<div class="box">

<h2>📊 Room Status</h2>

{% if full %}
<h3>✅ Room Filled</h3>
{% else %}
<h3>⏳ Waiting...</h3>
{% endif %}

{% for person in people %}
<hr>
<p><b>{{ person.name }}</b></p>
<p>{{ person.gender }} | {{ person.year }}</p>
<p>{{ person.block }}</p>
<p>{{ person.contact }}</p>
{% endfor %}

</div>

</body>
</html>
